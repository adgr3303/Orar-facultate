<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Orar Facultate</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf4ff,#f7f7fa 38%);min-height:100vh}
header{padding:calc(env(safe-area-inset-top) + 18px) 18px 12px;background:#0a84ff;color:#fff}
h1{font-size:30px;margin:0 0 4px}.sub{opacity:.85}
main{max-width:700px;margin:auto;padding:14px 14px 30px}
.week-picker{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 3px 14px #0000000a}
.week-picker label{display:block;font-size:13px;font-weight:700;color:#666;margin:0 0 6px}
.week-picker select{width:100%;border:0;background:#f2f2f7;border-radius:10px;padding:12px;font:inherit;font-weight:700;color:#111}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.days button{border:0;background:#fff;padding:10px 4px;border-radius:12px;font-weight:700;color:#555}
.days button.active{background:#111;color:#fff}
.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 14px #0000000a;display:flex;gap:14px}
.time{font-weight:800;min-width:82px}.title{font-weight:750;font-size:17px}.meta{color:#777;font-size:14px;margin-top:6px}
.pill{display:inline-block;background:#e8f2ff;color:#0878e8;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:700;margin-top:7px}
.empty{text-align:center;padding:50px 20px;color:#777} footer{text-align:center;color:#888;font-size:12px;padding:10px 0 30px}
@media(prefers-color-scheme:dark){body{background:#111}.days button,.card,.week-picker{background:#1c1c1e;color:#fff}.days button{color:#bbb}.days button.active{background:#fff;color:#111}.week-picker label{color:#aaa}.week-picker select{background:#2c2c2e;color:#fff}}
</style>
</head>
<body>
<header><h1>Orar Facultate</h1><div class="sub" id="date"></div></header>
<main>
<section class="week-picker"><label for="weekSelect">Alege săptămâna</label><select id="weekSelect" aria-label="Alege săptămâna"></select></section>
<div class="days" id="days"></div>
<div id="schedule"></div>

</main>
<script>
const weeks=[
["28.09","02.10"],["05.10","09.10"],["12.10","16.10"],["19.10","23.10"],["26.10","30.10"],
["02.11","06.11"],["09.11","13.11"],["16.11","20.11"],["23.11","27.11"],["30.11","04.12"],
["07.12","11.12"],["14.12","18.12"],["21.12","23.12"],["11.01","15.01"],["18.01","22.01"],
["22.02","26.02"],["01.03","05.03"],["08.03","12.03"],["15.03","19.03"],["22.03","26.03"],
["29.03","02.04"],["05.04","09.04"],["12.04","16.04"],["19.04","23.04"],["26.04","30.04"],
["10.05","14.05"],["17.05","21.05"],["24.05","28.05"],["31.05","04.06"]
];
const academicYear=2026;
function toDate(dayMonth){const [day,month]=dayMonth.split(".").map(Number);return new Date(academicYear+(month<9?1:0),month-1,day);}
function currentWeekIndex(today=new Date()){
 const found=weeks.findIndex(([start,end])=>today>=toDate(start)&&today<=toDate(end));
 if(found>=0)return found;
 const next=weeks.findIndex(([start])=>toDate(start)>today);
 return next>=0?next:weeks.length-1;
}
const data=[
["Luni","10:00","12:00","Elemente de bază în programare","Seminar","Lab. psihodiagn.",2],
["Luni","12:00","14:00","Metode de cercetare cantitative și statistică în psihologie și științe cognitive","Curs","Lab Info 1"],
["Luni","14:00","16:00","Introducere în psihologie","Curs","Amf. Zlate"],
["Luni","18:00","20:00","Psihologia educației (Modulul psihopedagogic)","Seminar","Sala 502 Leu"],
["Marți","08:00","10:00","Dezvoltarea limbajului și cogniției, opțional","Curs","Amf. Zlate"],
["Marți","10:00","12:00","Dezvoltarea limbajului și cogniției, opțional","Seminar","Amf. Zlate"],
["Marți","14:00","16:00","Franceză","Seminar",""],
["Marți","18:00","20:00","Introducere în științele cognitive","Seminar","Sala 4",2],
["Miercuri","08:00","10:00","Psihologia educației (Modulul psihopedagogic)","Curs","Amf. Damaschin"],
["Miercuri","10:00","12:00","Psihologie evoluționistă","Seminar","Sala 4",1],
["Miercuri","10:00","12:00","Introducere în neuroștiințe","Seminar","Lab. Pufan",2],
["Miercuri","12:00","14:00","Engleză","Seminar",""],
["Miercuri","14:00","16:00","Introducere în neuroștiințe","Curs","Amf. Motru"],
["Miercuri","18:00","20:00","Psihologie evoluționistă","Curs","Online"],
["Joi","18:00","20:00","Elemente de bază în programare","Curs","Amf. Stoian"],
["Vineri","08:00","10:00","Introducere în științele cognitive","Curs","Amf. Cantemir (Rectorat)"],
["Vineri","10:00","12:00","Metode de cercetare cantitative și statistică în psihologie și științe cognitive I","Curs","Amf. Cantemir (Rectorat)"],
["Vineri","12:00","14:00","Introducere în psihologie","Seminar","Centrul de management",1],
];
const days=["Luni","Marți","Miercuri","Joi","Vineri"];
let selectedWeek=currentWeekIndex();
const today=new Date();
const todayDay=today.getDay();
let selectedDay=todayDay>=1&&todayDay<=5?todayDay-1:0;
function optionLabel(index){
 const [start,end]=weeks[index];
 return "Săptămâna "+(index+1)+" · "+start+"–"+end+(index===currentWeekIndex()?" · săptămâna curentă":"");
}
function render(){
 const weekSelect=document.getElementById("weekSelect");
 if(weekSelect.options.length!==weeks.length){
   weekSelect.innerHTML=weeks.map((_,i)=>'<option value="'+i+'">'+optionLabel(i)+'</option>').join("");
   weekSelect.addEventListener("change",()=>{selectedWeek=Number(weekSelect.value);render();});
 }
 weekSelect.value=String(selectedWeek);
 const range=weeks[selectedWeek];
 document.getElementById("date").textContent=optionLabel(selectedWeek);
 document.getElementById("days").innerHTML=days.map((d,i)=>'<button class="'+(i===selectedDay?'active':'')+'" data-day="'+i+'">'+d.slice(0,3)+'</button>').join("");
 document.querySelectorAll("#days button").forEach(button=>button.addEventListener("click",()=>{selectedDay=Number(button.dataset.day);render();}));
 const items=data.filter(x=>x[0]===days[selectedDay]&&(!x[6]||x[6]===((selectedWeek+1)%2?1:2)));
 document.getElementById("schedule").innerHTML=items.length?items.map(x=>'<article class="card"><div class="time">'+x[1]+'<br>'+x[2]+'</div><div><div class="title">'+x[3]+'</div><span class="pill">'+x[4]+'</span>'+(x[6]?'<span class="pill">Săptămâna '+x[6]+'</span>':'')+(x[5]?'<div class="meta">📍 '+x[5]+'</div>':'')+'</div></article>').join(""):'<div class="empty">🎉 Zi liberă</div>';
}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("controllerchange",()=>window.location.reload());navigator.serviceWorker.register("sw.js");}
</script>
</body></html>
